name: Bug report
description: Report a reproducible problem.
body:
  - type: input
    id: version
    attributes:
      label: App version, Android version and device
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove credentials, media paths and personal data.
